<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Omni multimodal chat portal">
  <title>Omni Chat</title>
  <link rel="stylesheet" href="/assets/portal.css">
</head>
<body data-model="{{ model }}" data-max-upload-mib="{{ max_upload_mib }}">
  <main class="app-shell">
    <section class="chat-panel" aria-label="Omni chat">
      <div class="topbar">
        <div class="connection" id="header-status" role="status">
          <span class="status-dot"></span>
          <span id="status-text">Connecting</span>
        </div>
        <div class="top-actions">
          <button class="icon-button call-button" id="call-button" type="button" aria-label="Start voice call" aria-pressed="false" title="Start voice call">
            <svg class="call-start" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 3.8 10 7.3 8.2 9.5a15.2 15.2 0 0 0 6.3 6.3l2.2-1.8 3.5 2.8v2.1c0 .8-.6 1.4-1.4 1.4A15.1 15.1 0 0 1 3.7 5.2c0-.8.6-1.4 1.4-1.4h2.1Z"/></svg>
            <svg class="call-stop" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 14 14M7.2 3.8 10 7.3 8.2 9.5a15.2 15.2 0 0 0 6.3 6.3l2.2-1.8 3.5 2.8v2.1c0 .8-.6 1.4-1.4 1.4A15.1 15.1 0 0 1 3.7 5.2c0-.8.6-1.4 1.4-1.4h2.1Z"/></svg>
          </button>
          <button class="icon-button quiet-button" id="clear-button" type="button" aria-label="Clear conversation" title="Clear conversation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5"/></svg>
          </button>
        </div>
      </div>

      <div class="conversation" id="conversation" aria-live="polite">
        <article class="message assistant welcome-message">
          <div class="message-content">Ready for text, speech, images, or video.</div>
        </article>
      </div>

      <section class="composer" aria-label="Message composer">
        <div class="attachments" id="attachments" hidden></div>

        <div class="waveform" id="waveform" hidden>
          <canvas id="waveform-canvas" aria-label="Live microphone waveform"></canvas>
          <span id="recording-time">0:00</span>
        </div>

        <div class="camera-preview" id="camera-preview" hidden>
          <video id="camera-video" autoplay muted playsinline aria-label="Live device camera preview"></video>
          <span>REC</span>
        </div>

        <div class="composer-box">
          <textarea id="prompt" rows="1" maxlength="12000" aria-label="Message" placeholder="Message Omni"></textarea>
          <div class="actions">
            <label class="icon-button" for="media-input" aria-label="Attach audio, image, or video" title="Attach media">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 12.5 6.7-6.7a3 3 0 0 1 4.2 4.2l-9.2 9.2a5 5 0 0 1-7.1-7.1l9-9m-5.5 11.3 8.6-8.6"/></svg>
            </label>
            <input id="media-input" type="file" accept="audio/wav,.wav,image/jpeg,image/png,image/webp,video/mp4,video/webm" hidden>

            <button class="icon-button mic-button" id="mic-button" type="button" aria-label="Hold to record microphone" title="Hold to record">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Zm-7 9a7 7 0 0 0 14 0M12 19v3m-4 0h8"/></svg>
            </button>

            <button class="icon-button camera-button" id="camera-button" type="button" aria-label="Start device video recording" aria-pressed="false" title="Record device video">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Zm13 3 5-3v10l-5-3"/></svg>
            </button>

            <button class="icon-button speak-button" id="speak-toggle" type="button" aria-label="Enable spoken replies" aria-pressed="false" title="Spoken replies off">
              <svg class="speaker-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h4l5 4V6l-5 4H5Zm12-1a5 5 0 0 1 0 6m2-8a8 8 0 0 1 0 10"/></svg>
              <svg class="speaker-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h4l5 4V6l-5 4H5Zm12-1 5 6m0-6-5 6"/></svg>
            </button>

            <button class="icon-button send-button" id="send-button" type="button" aria-label="Send message" title="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Zm7 1 7-8"/></svg>
            </button>
          </div>
        </div>
        <p class="composer-status" id="composer-status">Hold the mic to record</p>
      </section>
    </section>
  </main>

  <template id="message-template">
    <article class="message">
      <div class="message-content"></div>
      <div class="audio-output" hidden></div>
    </article>
  </template>

  <script src="/assets/portal.js" defer></script>
</body>
</html>
