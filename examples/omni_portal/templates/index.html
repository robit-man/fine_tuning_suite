<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Omni multimodal chat portal">
  <title>Omni Chat</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/portal.css?v=20260902-generation-metrics">
</head>
<body data-model="{{ model }}" data-max-upload-mib="{{ max_upload_mib }}" data-session-scope="{{ session_scope }}">
  <main class="app-shell">
    <section class="chat-panel" aria-label="Omni chat">
      <div class="topbar">
        <div class="connection" id="header-status" role="status">
          <span class="status-dot"></span>
          <span id="status-text">Connecting</span>
          <span class="active-users" id="active-users" aria-label="0 active requests">
            <span aria-hidden="true">·</span><span id="active-user-count">0</span>
          </span>
        </div>
        <div class="top-actions">
          <button class="icon-button voice-button" id="voice-button" type="button" aria-label="Configure reply voice" title="Voice settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h2m2-5v10m4-14v18m4-15v12m4-8v4"/></svg>
          </button>
          <button class="icon-button camera-button" id="camera-button" type="button" aria-label="Start device video recording" aria-pressed="false" title="Record device video">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Zm13 3 5-3v10l-5-3"/></svg>
          </button>
          <button class="icon-button call-button" id="call-button" type="button" aria-label="Start voice call" aria-pressed="false" title="Start voice call">
            <svg class="call-start" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 3.8 10 7.3 8.2 9.5a15.2 15.2 0 0 0 6.3 6.3l2.2-1.8 3.5 2.8v2.1c0 .8-.6 1.4-1.4 1.4A15.1 15.1 0 0 1 3.7 5.2c0-.8.6-1.4 1.4-1.4h2.1Z"/></svg>
            <svg class="call-stop" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 14 14M7.2 3.8 10 7.3 8.2 9.5a15.2 15.2 0 0 0 6.3 6.3l2.2-1.8 3.5 2.8v2.1c0 .8-.6 1.4-1.4 1.4A15.1 15.1 0 0 1 3.7 5.2c0-.8.6-1.4 1.4-1.4h2.1Z"/></svg>
          </button>
          <button class="icon-button quiet-button" id="clear-button" type="button" aria-label="Clear conversation" title="Clear conversation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5"/></svg>
          </button>
        </div>
      </div>

      <div class="conversation" id="conversation" aria-live="polite">
        <article class="message assistant welcome-message">
          <div class="message-content">Ready for text, speech, images, or video.</div>
        </article>
      </div>

      <section class="composer" aria-label="Message composer">
        <button class="scroll-latest-button" id="scroll-latest-button" type="button" aria-label="Jump to latest message and resume auto-scroll" title="Jump to latest" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="attachments" id="attachments" hidden></div>

        <div class="waveform" id="waveform" hidden>
          <canvas id="waveform-canvas" aria-label="Live microphone waveform"></canvas>
          <span id="recording-time">0:00</span>
        </div>

        <div class="camera-preview" id="camera-preview" hidden>
          <video id="camera-video" autoplay muted playsinline aria-label="Live device camera preview"></video>
          <span>REC</span>
        </div>

        <div class="composer-box">
          <textarea id="prompt" rows="1" maxlength="12000" aria-label="Message" placeholder="Message Omni"></textarea>
          <div class="actions">
            <label class="icon-button" for="media-input" aria-label="Attach media or documents" title="Attach media or documents">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 12.5 6.7-6.7a3 3 0 0 1 4.2 4.2l-9.2 9.2a5 5 0 0 1-7.1-7.1l9-9m-5.5 11.3 8.6-8.6"/></svg>
            </label>
            <input id="media-input" type="file" multiple accept="audio/wav,.wav,image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,application/pdf,.pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.docx,text/*,.md,.markdown,.json,.jsonl,.yaml,.yml,.toml,.ini,.cfg,.rst,.sql,.py,.js,.mjs,.ts,.tsx,.jsx,.css,.sh,.ps1,.java,.go,.rs,.c,.h,.cpp,.hpp" hidden>

            <button class="icon-button mic-button" id="mic-button" type="button" aria-label="Hold to record microphone" title="Hold to record">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Zm-7 9a7 7 0 0 0 14 0M12 19v3m-4 0h8"/></svg>
            </button>

            <button class="icon-button speak-button" id="speak-toggle" type="button" aria-label="Enable spoken replies" aria-pressed="false" title="Spoken replies off">
              <svg class="speaker-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h4l5 4V6l-5 4H5Zm12-1a5 5 0 0 1 0 6m2-8a8 8 0 0 1 0 10"/></svg>
              <svg class="speaker-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h4l5 4V6l-5 4H5Zm12-1 5 6m0-6-5 6"/></svg>
            </button>

            <button class="icon-button think-button" id="think-toggle" type="button" aria-label="Enable reasoning" aria-pressed="false" title="Reasoning off">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 4.3A3.4 3.4 0 0 0 4.8 8a3.5 3.5 0 0 0 .7 6.7A3.5 3.5 0 0 0 10 19m4.5-14.7A3.4 3.4 0 0 1 19.2 8a3.5 3.5 0 0 1-.7 6.7A3.5 3.5 0 0 1 14 19M10 5v14m4-14v14M7 10h3m4 0h3M7 15h3m4 0h3"/></svg>
            </button>

            <button class="icon-button send-button" id="send-button" type="button" aria-label="Send message" title="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Zm7 1 7-8"/></svg>
            </button>
          </div>
        </div>
        <p class="composer-status" id="composer-status">Hold the mic to record</p>
      </section>
    </section>
  </main>

  <dialog class="voice-dialog" id="voice-dialog" aria-labelledby="voice-title">
    <section class="voice-sheet">
      <header class="voice-header">
        <div>
          <h2 id="voice-title">Reply voice</h2>
          <p>Qwen3-TTS Base · speaker-embedding clone</p>
        </div>
        <button class="icon-button" id="voice-close" type="button" aria-label="Close voice settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <div class="voice-mode-row" id="voice-mode-row">
        <button class="voice-mode-choice voice-clone-choice" id="voice-clone-toggle" type="button" aria-pressed="true">
          <strong>Voice Clone</strong><small>Enabled</small>
        </button>
        <button class="voice-mode-choice voice-preset-choice" id="voice-preset-toggle" type="button" aria-expanded="false">
          <strong>Select Preset</strong><small id="voice-preset-current">Female · Default</small>
        </button>
        <input id="voice-clone-enabled" type="checkbox" hidden checked>
      </div>
      <div class="voice-preset-options" id="voice-preset-options" hidden></div>

      <div class="voice-reference" id="voice-reference-controls">
        <div class="voice-reference-actions">
          <button class="voice-action" id="voice-record" type="button">Record reference</button>
          <label class="voice-action" for="voice-reference-input">Choose WAV</label>
          <input id="voice-reference-input" type="file" accept="audio/wav,.wav" hidden>
          <button class="voice-action quiet" id="voice-reference-clear" type="button">Clear</button>
        </div>
        <audio id="voice-reference-audio" controls playsinline hidden></audio>
        <p class="voice-reference-status" id="voice-reference-status">No reference selected</p>
        <p class="voice-consent">Clone only voices you own or have permission to use.</p>
      </div>

      <div class="voice-grid">
        <label>Language
          <select id="voice-language">
            <option value="en">English</option><option value="zh">Chinese</option>
            <option value="de">German</option><option value="it">Italian</option>
            <option value="pt">Portuguese</option><option value="es">Spanish</option>
            <option value="ja">Japanese</option><option value="ko">Korean</option>
            <option value="fr">French</option><option value="ru">Russian</option>
          </select>
        </label>
        <label>Seed
          <input id="voice-seed" type="number" min="-1" max="2147483647" step="1" value="42">
        </label>
        <label class="voice-wide">Temperature <output id="voice-temperature-value">0.70</output>
          <input id="voice-temperature" type="range" min="0" max="2" step="0.05" value="0.7">
        </label>
        <label class="voice-wide">Top P <output id="voice-top-p-value">0.90</output>
          <input id="voice-top-p" type="range" min="0" max="1" step="0.05" value="0.9">
        </label>
        <label>Top K
          <input id="voice-top-k" type="number" min="0" max="1000" step="1" value="40">
        </label>
        <label>Max frames
          <input id="voice-max-frames" type="number" min="1" max="2048" step="1" value="512">
        </label>
      </div>
      <footer class="voice-footer">
        <button class="voice-action quiet" id="voice-reset" type="button">Reset</button>
        <button class="voice-action primary" id="voice-done" type="button">Done</button>
      </footer>
    </section>
  </dialog>

  <template id="message-template">
    <article class="message">
      <div class="message-content"></div>
      <details class="thinking-output" hidden>
        <summary>Reasoning</summary>
        <div class="thinking-content"></div>
      </details>
      <details class="audio-observation-output" hidden>
        <summary>Sounds heard</summary>
        <div class="audio-observation-content"></div>
      </details>
      <div class="audio-output" hidden></div>
      <div class="message-footer" hidden>
        <span class="message-generation-metrics" hidden></span>
        <button class="message-copy-button" type="button" aria-label="Copy raw Markdown reply" title="Copy raw Markdown">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"/></svg>
        </button>
      </div>
    </article>
  </template>

  <script src="/assets/call_vad.js" defer></script>
  <script src="/assets/call_playback.js" defer></script>
  <script src="/assets/session_cache.js" defer></script>
  <script src="/assets/portal.js?v=20260902-generation-metrics" defer></script>
</body>
</html>
