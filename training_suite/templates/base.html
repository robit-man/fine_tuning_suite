<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Training Suite{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_for('dashboard') }}">Training Suite</a>
      <nav class="tabs" aria-label="Main">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('intake') }}">Intake</a>
        <a href="{{ url_for('datasets') }}">Datasets</a>
        <a href="{{ url_for('actions') }}">Actions</a>
        <a href="{{ url_for('export') }}">Export</a>
        <a href="{{ url_for('evaluation') }}">Evaluation</a>
        <a href="{{ url_for('compare_models') }}">Compare</a>
      </nav>
    </header>
    <main class="shell">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
