{% extends "base.html" %}
{% block title %}Job #{{ job.id }} - Training Suite{% endblock %}
{% block content %}
<section class="band">
  <div class="section-head">
    <h1>Job #{{ job.id }}</h1>
    <form method="post" action="{{ url_for('cancel_job', job_id=job.id) }}">
      <button type="submit" class="button danger">Cancel</button>
    </form>
  </div>
  <div class="summary-grid">
    <div><span class="label">Kind</span><strong>{{ job.kind }}</strong></div>
    <div><span class="label">Status</span><strong>{{ job.status }}</strong></div>
    <div><span class="label">Return</span><strong>{{ job.returncode if job.returncode is not none else "-" }}</strong></div>
    <div><span class="label">Log</span><strong>{{ job.log_path }}</strong></div>
  </div>
  <pre class="code log" id="job-log">{{ log }}</pre>
</section>
<script>
  const jobId = {{ job.id }};
  async function refreshLog() {
    const res = await fetch(`/api/jobs/${jobId}`);
    const data = await res.json();
    const log = document.getElementById("job-log");
    if (log) log.textContent = data.log || "";
    if (data.job && !["succeeded", "failed", "cancelled"].includes(data.job.status)) {
      setTimeout(refreshLog, 2000);
    }
  }
  setTimeout(refreshLog, 2000);
</script>
{% endblock %}
